<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Đầu Bò - Trần Bảo Nam</title>
    <style>
        * { padding: 0; margin: 0; overflow: hidden; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            transition: background-color 2s ease;
            display: flex; flex-direction: column; align-items: center;
            background-color: #BDC3C7; 
            touch-action: none;
        }
        body.night { background-color: #000000; }

        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); display: flex;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .night #menu { background: #1a1a1a; color: white; }

        .btn-group { display: flex; gap: 20px; margin-top: 20px; }
        .mode-btn {
            padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; 
            border-radius: 10px; font-weight: bold; transition: 0.3s;
        }
        #btn-easy { background: #27AE60; color: white; }
        #btn-hard { background: #C0392B; color: white; }
        .mode-btn:hover { transform: scale(1.1); }

        #gameCanvas { width: 100vw; height: 400px; display: block; }
        
        .ui { position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        #score { font-size: 40px; font-weight: bold; color: #2C3E50; }
        .night #score { color: #FFFFFF; }
        #timer { font-size: 18px; color: #7F8C8D; margin-top: 5px; font-weight: bold; }
        .night #timer { color: #ECF0F1; }

        #credit {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            color: #7F8C8D; font-size: 14px; letter-spacing: 1px;
        }
        .night #credit { color: #555; }
    </style>
</head>
<body>

<div id="menu">
    <h1 style="margin-bottom: 10px;">GAME ĐẦU BÒ 🐂</h1>
    <p style="color: #7F8C8D;">Thiết kế bởi Trần Bảo Nam - 2026</p>
    <div class="btn-group">
        <button id="btn-easy" class="mode-btn" onclick="startGame('easy')">CHẾ ĐỘ DỄ</button>
        <button id="btn-hard" class="mode-btn" onclick="startGame('hard')">CHẾ ĐỘ KHÓ</button>
    </div>
</div>

<div class="ui">
    <div id="score">0</div>
    <div id="timer">00:00</div>
</div>

<div id="credit">Game được thiết kế bởi Trần Bảo Nam - 2026</div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const timerElement = document.getElementById("timer");

    canvas.width = window.innerWidth;
    canvas.height = 400;

    let score = 0, gameActive = false, frameCount = 0, speed = 4.5; 
    let gameMode = 'easy';

    const player = { x: 80, y: 300, dy: 0, jumpForce: 15, gravity: 0.8, grounded: false };
    const obstacles = [];
    const airObjects = [];
    const decorations = [];

    function startGame(mode) {
        gameMode = mode;
        document.getElementById("menu").style.display = "none";
        gameActive = true; score = 0; frameCount = 0;
        
        // Cấu hình ban đầu cho từng chế độ
        speed = (gameMode === 'hard') ? 7.0 : 4.5;
        
        obstacles.length = 0; airObjects.length = 0;
        player.y = 300;
        initDecor();
        spawnObstacle();
        spawnAir();
    }

    function initDecor() {
        decorations.length = 0;
        for(let i=0; i<8; i++) decorations.push({ x: Math.random() * canvas.width, y: 345, emoji: "🌿" });
    }

    function spawnObstacle() {
        if (!gameActive) return;
        obstacles.push({ x: canvas.width + 100, y: 310, emoji: ["🌵", "💣", "🔥"][Math.floor(Math.random()*3)] });
        
        // Tần suất xuất hiện vật cản
        let baseWait = (gameMode === 'hard') ? 1200 : 2000;
        let randomWait = (gameMode === 'hard') ? 800 : 2000;
        
        // Khó hơn sau 5 phút (300s)
        let wait = (frameCount < 18000) ? baseWait + Math.random() * randomWait : 700 + Math.random() * 800;
        setTimeout(spawnObstacle, wait);
    }

    function spawnAir() {
        if (!gameActive) return;
        airObjects.push({ x: canvas.width + 100, y: 40 + Math.random() * 60, emoji: Math.random() > 0.5 ? "✈️" : "🐦" });
        setTimeout(spawnAir, 4000 + Math.random() * 3000);
    }

    function jump() {
        if (player.grounded && gameActive) {
            player.dy = -player.jumpForce;
            player.grounded = false;
        } else if (!gameActive && document.getElementById("menu").style.display === "none") {
            location.reload();
        }
    }

    window.addEventListener("mousedown", jump);
    window.addEventListener("touchstart", jump);
    window.addEventListener("keydown", (e) => { if(e.code === "Space") jump(); });

    function update() {
        if (!gameActive) return;

        frameCount++;
        let totalSeconds = Math.floor(frameCount / 60);
        timerElement.innerText = (totalSeconds < 10 ? "0" : "") + Math.floor(totalSeconds / 60) + ":" + (totalSeconds % 60 < 10 ? "0" : "") + (totalSeconds % 60);

        // Tăng độ khó theo thời gian
        let acceleration = (gameMode === 'hard') ? 0.02 : 0.01;
        if (totalSeconds < 300) speed += (acceleration / 60); 
        else speed += (0.05 / 60);

        player.dy += player.gravity;
        player.y += player.dy;
        if (player.y > 300) { player.y = 300; player.dy = 0; player.grounded = true; }

        obstacles.forEach((obs, index) => {
            obs.x -= speed;
            if (Math.abs(player.x - obs.x) < 30 && Math.abs(player.y - obs.y) < 30) gameActive = false;
            if (obs.x < -50) { obstacles.splice(index, 1); score++; scoreElement.innerText = score; }
        });

        airObjects.forEach((air, index) => { air.x -= speed * 0.5; if (air.x < -100) airObjects.splice(index, 1); });
        decorations.forEach(d => { d.x -= speed * 0.6; if (d.x < -50) d.x = canvas.width + 50; });
    }

    function draw() {
        let totalSeconds = Math.floor(frameCount / 60);
        let minuteInLoop = Math.floor(totalSeconds / 60) % 8;
        let isNight = minuteInLoop % 2 !== 0;
        document.body.className = isNight ? "night" : "";

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Mặt trời / Trăng
        ctx.textAlign = "left";
        if (!isNight) {
            ctx.font = "50px Arial"; ctx.fillText("☀️", 60, 80);
        } else {
            ctx.font = "50px Arial";
            if (minuteInLoop === 3) ctx.fillText("🌙", canvas.width - 100, 80);
            else if (minuteInLoop === 5) ctx.fillText("🌓", canvas.width - 100, 80);
            else if (minuteInLoop === 7) { ctx.fillStyle = "#F1C40F"; ctx.fillText("🌕", canvas.width - 100, 80); ctx.fillStyle = "black"; }
        }

        // Vẽ mờ các vật trang trí
        ctx.globalAlpha = 0.3; decorations.forEach(d => ctx.fillText(d.emoji, d.x, d.y));
        ctx.globalAlpha = 0.5; airObjects.forEach(air => ctx.fillText(air.emoji, air.x, air.y));
        ctx.globalAlpha = 1.0;

        // Vẽ Entity (Viền trắng ban đêm)
        function drawEntity(emoji, x, y, size, flip = false) {
            ctx.font = `${size}px Arial`;
            if (isNight) {
                ctx.strokeStyle = "white"; ctx.lineWidth = 1.5;
                if (flip) { ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); ctx.strokeText(emoji, -size/2, size/2); ctx.restore(); }
                else ctx.strokeText(emoji, x, y);
            } else {
                if (flip) { ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); ctx.fillText(emoji, -size/2, size/2); ctx.restore(); }
                else ctx.fillText(emoji, x, y);
            }
        }

        obstacles.forEach(obs => drawEntity(obs.emoji, obs.x, obs.y + 35, 40));
        drawEntity("🐂", player.x + 22, player.y + 10, 45, true);

        if (!gameActive && frameCount > 0) {
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.font = "bold 30px Arial";
            ctx.fillText("GAME OVER", canvas.width/2, 200);
            ctx.font = "18px Arial"; ctx.fillText("Bấm để chơi lại", canvas.width/2, 250);
        }

        update();
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
